name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --pool=forks --poolOptions.forks.singleFork
      - run: npm run docs:build
      - run: npm pack --dry-run
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/service.Dockerfile -t lesscode-service:test .
      - run: docker build -f docker/runner.Dockerfile -t lesscode-runner:test .
      - run: docker run --rm --network none --entrypoint node lesscode-service:test dist/cli/main.js --help
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges lesscode-runner:test node -e 'if (process.getuid() === 0) process.exit(1)'
